name: Daily Ukraine Territory Extraction

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - run: npm install
      
    - run: node daily-extract.js
      
    - run: |
        git config user.email "action@github.com"
        git config user.name "GitHub Action"
        git add daily_output/ snapshots/
        git commit -m "Daily extraction $(date -u +%Y-%m-%d)" || echo "No changes"
        git push
