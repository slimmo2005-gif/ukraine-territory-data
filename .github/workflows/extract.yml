# GitHub Actions Workflow for Daily Ukraine Data Extraction
name: Daily Ukraine Territory Extraction

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run extraction
      run: node daily-extract-v2.js
      
    - name: List output files
      run: |
        echo "Generated files:"
        ls -la data/ || echo "No data yet"
        
    - name: Commit data to repository
      run: |
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add data/
        if ! git diff --cached --quiet; then
          git commit -m "Daily extraction $(date -u +%Y-%m-%d)"
          git push origin HEAD:master || echo "Push failed - data saved as artifact only"
        else
          echo "No changes to commit"
        fi
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: daily-output-${{ github.run_id }}
        path: data/
